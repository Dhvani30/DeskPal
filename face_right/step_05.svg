<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">RIGHT FACE - Step 5: Solder and inspect</title><desc id="desc">The BME280 needs open vents so room air can reach its sensor. Flat dotted placement view for one cube face.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.4" fill="#64748b"/></pattern></defs>
<rect width="900" height="760" fill="#f8fafc"/><text x="35" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#142033">RIGHT FACE · Step 5: Solder and inspect</text><text x="35" y="72" font-family="sans-serif" font-size="15" fill="#475569">The BME280 needs open vents so room air can reach its sensor.</text>
<rect x="175" y="118" width="550" height="340" rx="7" fill="#e7efe8" stroke="#334155" stroke-width="3"/><rect x="177" y="120" width="546" height="336" fill="url(#dots)"/><text x="190" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">FLAT FACE PLANNING BOARD · 2.54 mm hole spacing</text>
<g opacity=".30"><g><rect x="365" y="215" width="170" height="190" rx="10" fill="#15803d" stroke="#166534" stroke-width="4"/><circle cx="510" cy="235" r="11" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="405" y="265" width="82" height="64" rx="7" fill="#94a3b8" stroke="#334155" stroke-width="3"/><text x="407" y="353" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">BME280</text><g fill="#d6a84f"><circle cx="385" cy="390" r="6"/><circle cx="420" cy="390" r="6"/><circle cx="455" cy="390" r="6"/><circle cx="490" cy="390" r="6"/></g></g></g><g opacity="1"><g stroke="#475569" stroke-width="6" stroke-linecap="round"><path d="M280 265h48M280 295h48M280 325h48M280 355h48"/></g><text x="280" y="390" font-family="sans-serif" font-size="12" fill="#334155">air vents in cube wall</text><text x="365" y="430" font-family="sans-serif" font-size="11" fill="#334155">VIN GND SCL SDA* header</text></g><g><path d="M385 390L320 430L280 430M420 390L320 445L280 445" fill="none" stroke="#dc2626" stroke-width="4"/><path d="M455 390L315 460L280 460M490 390L310 475L280 475" fill="none" stroke="#2563eb" stroke-width="5"/><text x="545" y="462" font-family="sans-serif" font-size="12" fill="#1e3a8a">SDA / SCL</text></g><g><g fill="#fef08a" stroke="#b45309" stroke-width="2"><circle cx="290" cy="430" r="8"/><circle cx="290" cy="445" r="8"/><circle cx="290" cy="460" r="8"/></g><text x="545" y="505" font-family="sans-serif" font-size="12" fill="#854d0e">Highlighted circles = joints to inspect</text></g>
<rect x="35" y="492" width="830" height="208" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="523" font-family="sans-serif" font-size="18" font-weight="700" fill="#142033">RIGHT FACE FOCUS: BME280 module and airflow openings.</text><text x="55" y="558" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">TOP SIDE · DO</text><text x="180" y="558" font-family="sans-serif" font-size="14" fill="#334155">Solder each lead by its label and keep the vent area open.</text><text x="55" y="591" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">BOTTOM SIDE · THEN</text><text x="220" y="591" font-family="sans-serif" font-size="14" fill="#334155">Avoid excess glue or solder near the tiny sensor opening.</text><text x="55" y="632" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">CHECKPOINT</text><text x="180" y="632" font-family="sans-serif" font-size="14" fill="#047857">Check: module is secure, vents are clear, and no adjacent pins bridge.</text>
<text x="55" y="672" font-family="sans-serif" font-size="12" fill="#64748b">Dotted background is a placement guide, not a cube wall. Mount the real component to the enclosure face.</text>
<g transform="translate(690 650)" font-family="sans-serif" font-size="11"><circle cx="0" cy="0" r="6" fill="#dc2626"/><text x="10" y="4" fill="#334155">3V3</text><circle cx="56" cy="0" r="6" fill="#111827"/><text x="66" y="4" fill="#334155">GND</text><circle cx="120" cy="0" r="6" fill="#2563eb"/><text x="130" y="4" fill="#334155">I2C</text></g>
</svg>