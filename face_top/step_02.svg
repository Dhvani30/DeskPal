<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">TOP FACE - Step 2: Place the main module</title><desc id="desc">Top carries touch, pushbutton, and slide switch controls. Flat dotted placement view for one cube face.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.4" fill="#64748b"/></pattern></defs>
<rect width="900" height="760" fill="#f8fafc"/><text x="35" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#142033">TOP FACE · Step 2: Place the main module</text><text x="35" y="72" font-family="sans-serif" font-size="15" fill="#475569">Top carries touch, pushbutton, and slide switch controls.</text>
<rect x="175" y="118" width="550" height="340" rx="7" fill="#e7efe8" stroke="#334155" stroke-width="3"/><rect x="177" y="120" width="546" height="336" fill="url(#dots)"/><text x="190" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">FLAT FACE PLANNING BOARD · 2.54 mm hole spacing</text>
<g opacity="1"><g><rect x="270" y="235" width="105" height="85" rx="9" fill="#15803d" stroke="#166534" stroke-width="3"/><circle cx="322" cy="276" r="31" fill="#d6a84f" stroke="#fef3c7" stroke-width="4"/><rect x="305" y="286" width="16" height="11" fill="#94a3b8"/><text x="270" y="340" font-family="sans-serif" font-size="12" fill="#334155">TTP223 touch board</text></g></g><g opacity="1"></g><g></g><g></g>
<rect x="35" y="492" width="830" height="208" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="523" font-family="sans-serif" font-size="18" font-weight="700" fill="#142033">TOP FACE FOCUS: keep the touch pad, red key, and slider distinct.</text><text x="55" y="558" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">TOP SIDE · DO</text><text x="180" y="558" font-family="sans-serif" font-size="14" fill="#334155">Place the TTP223 board under the planned touch area.</text><text x="55" y="591" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">BOTTOM SIDE · THEN</text><text x="220" y="591" font-family="sans-serif" font-size="14" fill="#334155">Keep its gold touch pad under thin plastic, wood, or another non-metal cover.</text><text x="55" y="632" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">CHECKPOINT</text><text x="180" y="632" font-family="sans-serif" font-size="14" fill="#047857">Check: metal screws and wires are not directly over its touch pad.</text>
<text x="55" y="672" font-family="sans-serif" font-size="12" fill="#64748b">Dotted background is a placement guide, not a cube wall. Mount the real component to the enclosure face.</text>
<g transform="translate(690 650)" font-family="sans-serif" font-size="11"><circle cx="0" cy="0" r="6" fill="#dc2626"/><text x="10" y="4" fill="#334155">3V3</text><circle cx="56" cy="0" r="6" fill="#111827"/><text x="66" y="4" fill="#334155">GND</text><circle cx="120" cy="0" r="6" fill="#2563eb"/><text x="130" y="4" fill="#334155">I2C</text></g>
</svg>