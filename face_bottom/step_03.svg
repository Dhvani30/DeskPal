<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">BOTTOM / INTERNAL SHELF - Step 3: Add header and remaining parts</title><desc id="desc">This is the one main perfboard shelf inside the cube, held above the bottom wall. Flat dotted placement view for one cube face.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.4" fill="#64748b"/></pattern></defs>
<rect width="900" height="760" fill="#f8fafc"/><text x="35" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#142033">BOTTOM / INTERNAL SHELF · Step 3: Add header and remaining parts</text><text x="35" y="72" font-family="sans-serif" font-size="15" fill="#475569">This is the one main perfboard shelf inside the cube, held above the bottom wall.</text>
<rect x="175" y="118" width="550" height="340" rx="7" fill="#e7efe8" stroke="#334155" stroke-width="3"/><rect x="177" y="120" width="546" height="336" fill="url(#dots)"/><text x="190" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">FLAT FACE PLANNING BOARD · 2.54 mm hole spacing</text>
<g opacity=".30"><g><rect x="290" y="186" width="178" height="232" rx="12" fill="#14532d" stroke="#064e3b" stroke-width="4"/><rect x="322" y="232" width="114" height="105" rx="9" fill="#94a3b8" stroke="#e2e8f0" stroke-width="4"/><text x="336" y="276" font-family="sans-serif" font-size="14" fill="#fff">ESP-WROOM-32</text><text x="348" y="297" font-family="sans-serif" font-size="12" fill="#fff">shield</text><path d="M306 199h146v24H306z" fill="#111827"/><text x="338" y="216" font-family="sans-serif" font-size="10" fill="#fff">ANTENNA</text><path d="M347 418v20h64v-20" fill="#cbd5e1" stroke="#334155" stroke-width="3"/><text x="345" y="458" font-family="sans-serif" font-size="12" fill="#334155">USB-C end</text></g></g><g opacity="1"><g><rect x="490" y="208" width="110" height="72" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/><rect x="480" y="230" width="20" height="30" rx="6" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><text x="512" y="250" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">TP4056</text><rect x="490" y="307" width="110" height="55" rx="20" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><path d="M493 350v18" stroke="#dc2626" stroke-width="4"/><path d="M503 350v18" stroke="#111827" stroke-width="4"/><text x="516" y="340" font-family="sans-serif" font-size="12" fill="#334155">LiPo 500 mAh</text><rect x="490" y="380" width="110" height="45" rx="6" fill="#16a34a" stroke="#14532d" stroke-width="3"/><rect x="532" y="390" width="22" height="18" rx="3" fill="#1f2937"/><text x="496" y="441" font-family="sans-serif" font-size="11" fill="#166534">extra 3.3 V regulator</text><ellipse cx="250" cy="375" rx="25" ry="17" fill="#111827"/><ellipse cx="250" cy="368" rx="25" ry="9" fill="#1f2937"/><circle cx="250" cy="368" r="5" fill="#020617"/><text x="220" y="405" font-family="sans-serif" font-size="11" fill="#334155">active buzzer</text></g></g><g></g><g></g>
<rect x="35" y="492" width="830" height="208" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="523" font-family="sans-serif" font-size="18" font-weight="700" fill="#142033">INTERNAL SHELF FOCUS: ESP32, charger, battery, buzzer and regulator space.</text><text x="55" y="558" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">TOP SIDE · DO</text><text x="180" y="558" font-family="sans-serif" font-size="14" fill="#334155">Add the charger and regulator only if they fit without crowding.</text><text x="55" y="591" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">BOTTOM SIDE · THEN</text><text x="220" y="591" font-family="sans-serif" font-size="14" fill="#334155">Place the active buzzer with its sound hole open; put the LiPo beside the board.</text><text x="55" y="632" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">CHECKPOINT</text><text x="180" y="632" font-family="sans-serif" font-size="14" fill="#047857">Check: the LiPo pouch cannot touch solder legs or screw tips.</text>
<text x="55" y="672" font-family="sans-serif" font-size="12" fill="#64748b">Dotted background is a placement guide, not a cube wall. Mount the real component to the enclosure face.</text>
<g transform="translate(690 650)" font-family="sans-serif" font-size="11"><circle cx="0" cy="0" r="6" fill="#dc2626"/><text x="10" y="4" fill="#334155">3V3</text><circle cx="56" cy="0" r="6" fill="#111827"/><text x="66" y="4" fill="#334155">GND</text><circle cx="120" cy="0" r="6" fill="#2563eb"/><text x="130" y="4" fill="#334155">I2C</text></g>
</svg>