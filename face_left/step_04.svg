<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">LEFT FACE - Step 4: Route labeled wires</title><desc id="desc">The round INMP441 microphone board sits behind a clear sound opening. Flat dotted placement view for one cube face.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.4" fill="#64748b"/></pattern></defs>
<rect width="900" height="760" fill="#f8fafc"/><text x="35" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#142033">LEFT FACE · Step 4: Route labeled wires</text><text x="35" y="72" font-family="sans-serif" font-size="15" fill="#475569">The round INMP441 microphone board sits behind a clear sound opening.</text>
<rect x="175" y="118" width="550" height="340" rx="7" fill="#e7efe8" stroke="#334155" stroke-width="3"/><rect x="177" y="120" width="546" height="336" fill="url(#dots)"/><text x="190" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">FLAT FACE PLANNING BOARD · 2.54 mm hole spacing</text>
<g opacity=".30"><g><circle cx="450" cy="278" r="80" fill="#111827" stroke="#475569" stroke-width="5"/><circle cx="450" cy="278" r="37" fill="#020617"/><circle cx="450" cy="278" r="10" fill="#475569"/><circle cx="405" cy="228" r="8" fill="#d6a84f"/><circle cx="495" cy="228" r="8" fill="#d6a84f"/><circle cx="405" cy="328" r="8" fill="#d6a84f"/><circle cx="495" cy="328" r="8" fill="#d6a84f"/><text x="380" y="380" font-family="sans-serif" font-size="14" fill="#334155">INMP441 round breakout</text></g></g><g opacity="1"><g><rect x="365" y="397" width="170" height="35" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><g fill="#d6a84f"><circle cx="378" cy="414" r="5"/><circle cx="408" cy="414" r="5"/><circle cx="438" cy="414" r="5"/><circle cx="468" cy="414" r="5"/><circle cx="498" cy="414" r="5"/><circle cx="528" cy="414" r="5"/></g><text x="373" y="454" font-family="sans-serif" font-size="11" fill="#334155">VDD GND L/R WS SCK SD*</text></g></g><g><path d="M378 420L320 430L280 430M408 420L320 445L280 445" fill="none" stroke="#dc2626" stroke-width="4"/><path d="M438 420L315 458L280 458M468 420L310 470L280 470M498 420L305 482L280 482" fill="none" stroke="#eab308" stroke-width="5"/><path d="M528 420L300 495L280 495" fill="none" stroke="#111827" stroke-width="4"/><text x="545" y="468" font-family="sans-serif" font-size="12" fill="#854d0e">SCK 18 / WS 19 / SD 35</text></g><g></g>
<rect x="35" y="492" width="830" height="208" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="523" font-family="sans-serif" font-size="18" font-weight="700" fill="#142033">LEFT FACE FOCUS: round microphone board and open sound port.</text><text x="55" y="558" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">TOP SIDE · DO</text><text x="180" y="558" font-family="sans-serif" font-size="14" fill="#334155">Route VDD red, GND black, and SCK/WS/SD yellow to the shelf.</text><text x="55" y="591" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">BOTTOM SIDE · THEN</text><text x="220" y="591" font-family="sans-serif" font-size="14" fill="#334155">Use GPIO18 for SCK, GPIO19 for WS, and GPIO35 for SD to match firmware.</text><text x="55" y="632" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">CHECKPOINT</text><text x="180" y="632" font-family="sans-serif" font-size="14" fill="#047857">Check: mic receives 3.3 V only and each wire reaches its matching pin.</text>
<text x="55" y="672" font-family="sans-serif" font-size="12" fill="#64748b">Dotted background is a placement guide, not a cube wall. Mount the real component to the enclosure face.</text>
<g transform="translate(690 650)" font-family="sans-serif" font-size="11"><circle cx="0" cy="0" r="6" fill="#dc2626"/><text x="10" y="4" fill="#334155">3V3</text><circle cx="56" cy="0" r="6" fill="#111827"/><text x="66" y="4" fill="#334155">GND</text><circle cx="120" cy="0" r="6" fill="#2563eb"/><text x="130" y="4" fill="#334155">I2C</text></g>
</svg>