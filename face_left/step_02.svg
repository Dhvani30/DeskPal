<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">LEFT FACE - Step 2: Place the main module</title><desc id="desc">The round INMP441 microphone board sits behind a clear sound opening. Flat dotted placement view for one cube face.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.4" fill="#64748b"/></pattern></defs>
<rect width="900" height="760" fill="#f8fafc"/><text x="35" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#142033">LEFT FACE · Step 2: Place the main module</text><text x="35" y="72" font-family="sans-serif" font-size="15" fill="#475569">The round INMP441 microphone board sits behind a clear sound opening.</text>
<rect x="175" y="118" width="550" height="340" rx="7" fill="#e7efe8" stroke="#334155" stroke-width="3"/><rect x="177" y="120" width="546" height="336" fill="url(#dots)"/><text x="190" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">FLAT FACE PLANNING BOARD · 2.54 mm hole spacing</text>
<g opacity="1"><g><circle cx="450" cy="278" r="80" fill="#111827" stroke="#475569" stroke-width="5"/><circle cx="450" cy="278" r="37" fill="#020617"/><circle cx="450" cy="278" r="10" fill="#475569"/><circle cx="405" cy="228" r="8" fill="#d6a84f"/><circle cx="495" cy="228" r="8" fill="#d6a84f"/><circle cx="405" cy="328" r="8" fill="#d6a84f"/><circle cx="495" cy="328" r="8" fill="#d6a84f"/><text x="380" y="380" font-family="sans-serif" font-size="14" fill="#334155">INMP441 round breakout</text></g></g><g opacity="1"></g><g></g><g></g>
<rect x="35" y="492" width="830" height="208" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="523" font-family="sans-serif" font-size="18" font-weight="700" fill="#142033">LEFT FACE FOCUS: round microphone board and open sound port.</text><text x="55" y="558" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">TOP SIDE · DO</text><text x="180" y="558" font-family="sans-serif" font-size="14" fill="#334155">Place the actual round INMP441 board over its intended opening.</text><text x="55" y="591" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">BOTTOM SIDE · THEN</text><text x="220" y="591" font-family="sans-serif" font-size="14" fill="#334155">Trace its edge and mounting/pin locations; do not drill until measured.</text><text x="55" y="632" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">CHECKPOINT</text><text x="180" y="632" font-family="sans-serif" font-size="14" fill="#047857">Check: no wall material covers the mic sound port.</text>
<text x="55" y="672" font-family="sans-serif" font-size="12" fill="#64748b">Dotted background is a placement guide, not a cube wall. Mount the real component to the enclosure face.</text>
<g transform="translate(690 650)" font-family="sans-serif" font-size="11"><circle cx="0" cy="0" r="6" fill="#dc2626"/><text x="10" y="4" fill="#334155">3V3</text><circle cx="56" cy="0" r="6" fill="#111827"/><text x="66" y="4" fill="#334155">GND</text><circle cx="120" cy="0" r="6" fill="#2563eb"/><text x="130" y="4" fill="#334155">I2C</text></g>
</svg>