<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">BACK FACE - Step 4: Route labeled wires</title><desc id="desc">Keep separate access openings for the charger and ESP32 USB-C sockets. Flat dotted placement view for one cube face.</desc>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="3.4" fill="#64748b"/></pattern></defs>
<rect width="900" height="760" fill="#f8fafc"/><text x="35" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#142033">BACK FACE · Step 4: Route labeled wires</text><text x="35" y="72" font-family="sans-serif" font-size="15" fill="#475569">Keep separate access openings for the charger and ESP32 USB-C sockets.</text>
<rect x="175" y="118" width="550" height="340" rx="7" fill="#e7efe8" stroke="#334155" stroke-width="3"/><rect x="177" y="120" width="546" height="336" fill="url(#dots)"/><text x="190" y="108" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">FLAT FACE PLANNING BOARD · 2.54 mm hole spacing</text>
<g opacity=".30"><g><rect x="340" y="225" width="170" height="112" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/><rect x="327" y="263" width="28" height="38" rx="7" fill="#cbd5e1" stroke="#334155" stroke-width="3"/><rect x="374" y="243" width="32" height="28" rx="3" fill="#111827"/><rect x="420" y="243" width="32" height="28" rx="3" fill="#111827"/><circle cx="476" cy="252" r="5" fill="#ef4444"/><circle cx="490" cy="252" r="5" fill="#22c55e"/><text x="375" y="300" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">TP4056</text><text x="376" y="320" font-family="sans-serif" font-size="11" fill="#fff">charger board</text></g></g><g opacity="1"><g><rect x="290" y="372" width="108" height="38" rx="12" fill="#334155" stroke="#0f172a" stroke-width="3"/><text x="405" y="397" font-family="sans-serif" font-size="12" fill="#334155">ESP32 USB-C opening</text><rect x="300" y="218" width="250" height="128" rx="7" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 5"/><text x="517" y="277" font-family="sans-serif" font-size="11" fill="#78350f">charger USB-C</text></g></g><g><path d="M342 333 L310 430 L275 430" fill="none" stroke="#dc2626" stroke-width="5"/><path d="M356 333 L320 445 L275 445" fill="none" stroke="#111827" stroke-width="5"/><text x="490" y="430" font-family="sans-serif" font-size="12" fill="#991b1b">BAT+ / GND</text></g><g></g>
<rect x="35" y="492" width="830" height="208" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="55" y="523" font-family="sans-serif" font-size="18" font-weight="700" fill="#142033">BACK FACE FOCUS: TP4056 USB-C access; ESP32 USB-C is a different port.</text><text x="55" y="558" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">TOP SIDE · DO</text><text x="180" y="558" font-family="sans-serif" font-size="14" fill="#334155">Plan protected battery wires from OUT+/- toward the inside power switch.</text><text x="55" y="591" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f766e">BOTTOM SIDE · THEN</text><text x="220" y="591" font-family="sans-serif" font-size="14" fill="#334155">Keep charger input (USB-C) distinct from battery pads and load output pads.</text><text x="55" y="632" font-family="sans-serif" font-size="14" font-weight="700" fill="#047857">CHECKPOINT</text><text x="180" y="632" font-family="sans-serif" font-size="14" fill="#047857">Check: you can read B+/B- and OUT+/OUT- labels before soldering.</text>
<text x="55" y="672" font-family="sans-serif" font-size="12" fill="#64748b">Dotted background is a placement guide, not a cube wall. Mount the real component to the enclosure face.</text>
<g transform="translate(690 650)" font-family="sans-serif" font-size="11"><circle cx="0" cy="0" r="6" fill="#dc2626"/><text x="10" y="4" fill="#334155">3V3</text><circle cx="56" cy="0" r="6" fill="#111827"/><text x="66" y="4" fill="#334155">GND</text><circle cx="120" cy="0" r="6" fill="#2563eb"/><text x="130" y="4" fill="#334155">I2C</text></g>
</svg>